<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slotwise Booking Page Redesign Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #171426;
      --muted: #766b7b;
      --line: #eadfe7;
      --soft: #fff7f9;
      --card: #fffefe;
      --shadow: 0 18px 45px rgba(44, 34, 56, .08);
      font-family: "DM Sans", Arial, sans-serif;
      color: var(--ink);
      background: #f6f3ee;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; }
    h1, h2, h3 { font-family: "Manrope", Arial, sans-serif; letter-spacing: -.02em; margin: 0; }
    p { margin: 0; line-height: 1.55; color: var(--muted); }
    .top { max-width: 1180px; margin: 0 auto 24px; }
    .top h1 { font-size: clamp(30px, 4vw, 44px); }
    .top p { margin-top: 8px; max-width: 760px; }
    .tabs { max-width: 1180px; margin: 0 auto 18px; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; }
    .tabs a { white-space: nowrap; text-decoration: none; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 9px 13px; font-weight: 700; font-size: 13px; }
    .previewGrid { max-width: 1180px; margin: 0 auto 34px; display: grid; grid-template-columns: 1fr 390px; gap: 18px; align-items: start; }
    .frameLabel { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-weight: 700; color: #675b6f; font-size: 13px; }
    .phoneFrame, .desktopFrame { border: 1px solid #ddd3dc; border-radius: 22px; background: #fefefe; box-shadow: var(--shadow); overflow: hidden; }
    .phoneFrame { width: 390px; }
    .bookingPage { --primary: #8b5cf6; --accent: #f7efff; min-height: 720px; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 65%, white), #fff); padding: 22px; }
    .bookingShell { display: grid; grid-template-columns: .88fr 1.12fr; gap: 18px; }
    .brandPanel { min-height: 640px; border-radius: 18px; overflow: hidden; color: white; background: linear-gradient(180deg, rgba(19, 18, 33, .12), rgba(19, 18, 33, .75)), var(--hero); background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: space-between; padding: 22px; }
    .brandTop { display: flex; align-items: center; gap: 12px; }
    .logo { width: 52px; height: 52px; border-radius: 16px; background: rgba(255,255,255,.9); display: grid; place-items: center; color: var(--primary); font-weight: 800; }
    .brandPanel h2 { font-size: clamp(29px, 4vw, 42px); max-width: 430px; }
    .brandPanel p { color: rgba(255,255,255,.86); max-width: 420px; }
    .trust { display: grid; gap: 8px; }
    .trust span { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 14px; background: rgba(255,255,255,.14); backdrop-filter: blur(10px); font-size: 13px; font-weight: 700; }
    .bookingCard { border-radius: 18px; background: rgba(255,255,255,.92); border: 1px solid rgba(255,255,255,.7); padding: 20px; box-shadow: var(--shadow); }
    .notice { background: #edf4ff; color: #3153ad; border-radius: 10px; padding: 12px 14px; font-weight: 700; font-size: 13px; margin-bottom: 18px; }
    .formHeader { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .formHeader h2 { font-size: clamp(25px, 3vw, 34px); }
    .formHeaderIcon { width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center; background: var(--accent); color: var(--primary); font-size: 22px; flex: 0 0 auto; }
    .contactChips { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 7px 11px; background: #fff7f8; color: #6b4a55; font-size: 12px; font-weight: 650; }
    .chip b { color: var(--primary); font-size: 10px; text-transform: uppercase; }
    .step { margin-top: 18px; }
    .stepTitle { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; color: var(--primary); font-weight: 800; font-size: 13px; }
    .stepTitle i { width: 24px; height: 24px; border: 1px solid var(--primary); border-radius: 999px; display: grid; place-items: center; font-style: normal; }
    .serviceGrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .serviceCard { position: relative; min-height: 160px; border: 1px solid var(--line); background: #fff; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 9px; }
    .serviceCard.selected { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); background: color-mix(in srgb, var(--accent) 42%, white); }
    .serviceIcon { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; background: var(--accent); color: var(--primary); font-size: 20px; }
    .check { position: absolute; right: 14px; top: 14px; width: 22px; height: 22px; border-radius: 99px; display: grid; place-items: center; background: var(--primary); color: white; font-size: 13px; }
    .serviceCard strong { font-family: "Manrope"; font-size: 17px; }
    .serviceCard small { color: var(--muted); font-weight: 700; }
    .actions { margin-top: auto; display: flex; gap: 8px; }
    .actions span { border: 1px solid var(--line); border-radius: 999px; padding: 9px 12px; font-weight: 800; font-size: 13px; color: var(--ink); background: white; }
    .controlGrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .dateCard, .inputCard, .summary { border: 1px solid var(--line); border-radius: 14px; background: #fff; padding: 14px; }
    .dateCard.selected { border-color: var(--primary); background: color-mix(in srgb, var(--accent) 38%, white); }
    .dateCard strong, .summary strong { display: block; font-family: "Manrope"; font-size: 18px; margin-top: 5px; }
    .fieldGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .inputCard { color: var(--muted); font-size: 13px; font-weight: 700; }
    .inputCard span { display: block; margin-top: 8px; height: 18px; border-radius: 5px; background: #f6edf2; }
    .summary { background: linear-gradient(135deg, #f8fffb, #fffaf2); border-color: #d4ead9; }
    .summaryRow { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; font-size: 14px; }
    .cta { margin-top: 14px; width: 100%; border: 0; border-radius: 14px; padding: 14px 18px; background: var(--primary); color: white; font: 800 15px "DM Sans"; }
    .mobile .bookingPage { padding: 14px; min-height: auto; }
    .mobile .bookingShell { display: block; }
    .mobile .brandPanel { min-height: 250px; border-radius: 18px 18px 0 0; }
    .mobile .brandPanel h2 { font-size: 27px; }
    .mobile .bookingCard { border-radius: 0 0 18px 18px; padding: 16px; }
    .mobile .formHeader { align-items: flex-start; }
    .mobile .formHeader h2 { font-size: 26px; }
    .mobile .serviceGrid, .mobile .controlGrid, .mobile .fieldGrid { grid-template-columns: 1fr; }
    .mobile .serviceCard { min-height: 138px; }
    .mockup { display: none; }
    .mockup.active { display: block; }
    .consultant { --primary:#f6b400; --accent:#fff5c7; --hero: linear-gradient(145deg,#172033,#667085); }
    .beauty { --primary:#bd5d6d; --accent:#fde8ee; --hero: linear-gradient(145deg,#b84b64,#f0b4bf); }
    .clinic { --primary:#148d84; --accent:#ddfbf5; --hero: linear-gradient(145deg,#0f766e,#8fe7de); }
    .home { --primary:#155e75; --accent:#e5f6fb; --hero: linear-gradient(145deg,#0f3f4f,#2b8bb4); }
    .tours { --primary:#0f766e; --accent:#e2f7ef; --hero: linear-gradient(145deg,#0b525b,#f59e0b); }
    .staycation { --primary:#7a4f2f; --accent:#f8efe6; --hero: linear-gradient(145deg,#4b2f23,#c89b74); }
    @media (max-width: 980px) {
      body { padding: 16px; }
      .previewGrid { grid-template-columns: 1fr; }
      .phoneFrame { width: 100%; max-width: 390px; }
      .bookingShell { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="top">
    <h1>Slotwise Public Booking Page Preview</h1>
    <p>Preview only. This mockup uses the current booking flow and fields: business header, service selection, date/time, customer details, summary, and CTA. Production components are untouched.</p>
  </header>
  <nav class="tabs">
    <a href="#consultant">Consultant</a>
    <a href="#beauty">Beauty</a>
    <a href="#clinic">Clinic</a>
    <a href="#home">Home Service</a>
    <a href="#tours">Tours</a>
    <a href="#staycation">Staycation</a>
  </nav>
  <main id="app"></main>
  <script>
    const templates = [
      { id: "consultant", name: "Brightplan Solutions", type: "Plans & Services", icon: "✦", phone: "0964-905-9206 / 0907-521-2718", title: "Plans & Services", sub: "Explore available plans, choose a time, and send your details.", services: ["MAXICARE", "MEDICARD"], meta: ["HMO PLAN", "See Plan Details"], cta: "Submit Inquiry" },
      { id: "beauty", name: "ABC Beauty Studio", type: "Beauty & Wellness", icon: "✧", phone: "0912 345 6789", title: "Book an Appointment", sub: "Choose a beauty service, pick a schedule, and get confirmation.", services: ["Hair Color", "Facial Treatment"], meta: ["PHP 1,200", "PHP 850"], cta: "Book Appointment" },
      { id: "clinic", name: "SmileCare Dental", type: "Care & Wellness", icon: "+", phone: "0917 222 8100", title: "Book a Visit", sub: "Select a treatment and preferred appointment time.", services: ["Dental Consult", "Tooth Extraction"], meta: ["No price", "No price"], cta: "Request Appointment" },
      { id: "home", name: "FixPro Home Services", type: "Home Services", icon: "⌂", phone: "0920 555 0192", title: "Book a Service", sub: "Choose the repair or home service you need.", services: ["Aircon Cleaning", "Plumbing Repair"], meta: ["PHP 650", "No price"], cta: "Book Service" },
      { id: "tours", name: "Cebu Island Tours", type: "Tours & Travel", icon: "⌁", phone: "0998 777 1111", title: "Book Your Tour", sub: "Choose your package, travel date, and guest count.", services: ["Bohol Day Tour", "Airport Transfer"], meta: ["PHP 1,499 / pax", "PHP 1,200 / trip"], cta: "Reserve Tour" },
      { id: "staycation", name: "Casa Gloria Staycation", type: "Staycation", icon: "☾", phone: "0916 888 4232", title: "Reserve Your Stay", sub: "Choose a unit, check-in date, time, and guest details.", services: ["1BR Staycation Unit", "Family Suite"], meta: ["PHP 2,500 / night", "PHP 4,200 / night"], cta: "Reserve Stay" }
    ];
    const app = document.getElementById("app");
    const renderCard = (tpl, mobile = false) => `
      <section class="${mobile ? "mobile " : ""}${tpl.id} bookingPage">
        <div class="bookingShell">
          <aside class="brandPanel">
            <div class="brandTop"><div class="logo">${tpl.icon}</div><div><strong>${tpl.name}</strong><p>${tpl.type}</p></div></div>
            <div><h2>${tpl.name}</h2><p>Modern public booking page using the same Slotwise flow and template-aware styling.</p></div>
            <div class="trust"><span>✓ Easy booking</span><span>✓ Clear schedule</span><span>✓ Customer details saved</span></div>
          </aside>
          <section class="bookingCard">
            <div class="notice">Demo preview. Submissions are simulated until activated.</div>
            <div class="formHeader"><div><h2>${tpl.title}</h2><p>${tpl.sub}</p><div class="contactChips"><span class="chip">☎ <b>Phone</b>${tpl.phone}</span></div></div><span class="formHeaderIcon">${tpl.icon}</span></div>
            <div class="step"><div class="stepTitle"><i>1</i><span>${tpl.type}</span></div><div class="serviceGrid">
              ${tpl.services.map((svc, i) => `<article class="serviceCard ${i === 1 ? "selected" : ""}"><span class="serviceIcon">${tpl.icon}</span>${i === 1 ? "<span class='check'>✓</span>" : ""}<strong>${svc}</strong><small>${tpl.meta[i]}</small>${tpl.id === "consultant" ? "<div class='actions'><span>Open Plan / Service Link</span></div>" : ""}</article>`).join("")}
            </div></div>
            <div class="step"><div class="stepTitle"><i>2</i><span>Pick a Time</span></div><div class="controlGrid"><div class="dateCard selected"><small>Selected</small><strong>Aug 30</strong><p>Sunday</p></div><div class="dateCard"><small>Time</small><strong>10:15 AM</strong><p>Available</p></div><div class="dateCard"><small>Guests</small><strong>${tpl.id === "staycation" || tpl.id === "tours" ? "2" : "1"}</strong><p>${tpl.id === "staycation" ? "pax" : "customer"}</p></div></div></div>
            <div class="step"><div class="stepTitle"><i>3</i><span>Customer Information</span></div><div class="fieldGrid"><div class="inputCard">Full Name<span></span></div><div class="inputCard">Phone or Contact<span></span></div><div class="inputCard">Notes<span></span></div><div class="inputCard">Address / Pickup if required<span></span></div></div></div>
            <div class="step summary"><small>Booking Summary</small><strong>${tpl.services[1]}</strong><div class="summaryRow"><span>Selected schedule</span><b>Aug 30, 10:15 AM</b></div><button class="cta">${tpl.cta}</button></div>
          </section>
        </div>
      </section>`;
    app.innerHTML = templates.map((tpl) => `
      <section id="${tpl.id}" class="previewGrid">
        <div><div class="frameLabel"><span>${tpl.type} desktop</span><span>Shared system</span></div><div class="desktopFrame">${renderCard(tpl)}</div></div>
        <div><div class="frameLabel"><span>${tpl.type} mobile</span><span>390px</span></div><div class="phoneFrame">${renderCard(tpl, true)}</div></div>
      </section>`).join("");
  </script>
</body>
</html>
